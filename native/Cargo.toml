[package]
name = "echo-carve-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/markup-carve/echo-carve"
homepage = "https://markup-carve.github.io/carve/"

[lib]
name = "carve_ffi"
crate-type = ["cdylib"]

[dependencies]
carve = { git = "https://github.com/markup-carve/carve-rs.git", rev = "388348a0ffcc54e508a37af1a6952c01cb16e137", package = "carve-lang", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
